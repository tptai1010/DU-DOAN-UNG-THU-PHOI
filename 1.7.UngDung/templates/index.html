<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Lung Cancer Prediction System</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@400;600;700&display=swap" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

	<style>
		body{
			font-family:"Segoe UI", Roboto, sans-serif;
			background:#dbe7ee;
		}

		/* CONTAINER*/
		.container-box{
			max-width:900px;
			margin:120px auto;
			padding:80px 60px;
			
			background-color:#6691c8; 

			background-image:url("../static/img/01.png");
			background-size:cover;
			background-position:center;
			background-repeat:no-repeat;

			border-radius:20px;
			box-shadow:0 20px 50px rgba(0,0,0,0.45);

			text-align:center;
			position:relative;
			overflow:hidden;
		}

		/* lớp làm ảnh trong suốt nhẹ */
		.container-box::before{
			content:"";
			position:absolute;
			inset:0;
			background:rgba(255,255,255,0.15);
			border-radius:20px;
		}

		/* cho nội dung nổi lên */

		.container-box > *{
			position:relative;
			z-index:2;
		}

		/* TITLE */
		.header-title{
			font-family:'Rokkitt', serif;
			font-weight:800;
			font-size:55px;
			color:white;
			margin-bottom:45px;
		}

		hr{
			border:1.5px solid rgba(255,255,255,0.6);
			margin:15px 0 40px 0;
		}

		/* BUTTON CARD */
		.mode-card{
			padding:35px;
			border-radius:14px;
			color:white;
			font-weight:600;
			font-size:20px;
			text-decoration:none;
			display:block;
			transition:all 0.3s ease;
		}

		.mode-card i{
			font-size:40px;
			margin-bottom:15px;
		}

		/* single */
		.single{
			background:linear-gradient(135deg,#3a7bd5,#00d2ff);
		}

		/* multiple */
		.multiple{
			background:linear-gradient(135deg,#ff512f,#dd2476);
		}

		/* hover */
		.mode-card:hover{
			transform:translateY(-6px);
			box-shadow:0 10px 25px rgba(0,0,0,0.4);
			color:white;
		}

	</style>
</head>

<body>
	<div class="container-box">

		<div class="header-title">
			Lung Cancer Prediction System
		</div>

		<div class="row g-4">
			<div class="col-md-6">
				<a href="{{ url_for('single') }}" class="mode-card single transition-link">
					<i class="fa-solid fa-user"></i><br>
					Single Patient
				</a>
			</div>

			<div class="col-md-6">
				<a href="{{ url_for('multiple') }}" class="mode-card multiple transition-link">
					<i class="fa-solid fa-users"></i><br>
					Multiple Patients
				</a>
			</div>
		</div>
	</div>

</body>
</html>
